name: Build orbit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  orbit-build:
    name: Build orbit-core
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v6

      # Set up Java
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Set up Gradle (includes wrapper validation and dependency graph submission)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          dependency-graph: generate-and-submit

      # Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Build JAR file with Gradle
      - name: Build JAR file
        run: ./gradlew build

      # Upload test reports, especially on failure
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/test'

      # Upload JAR artifacts
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v7
        with:
          name: orbit-jars
          path: '**/build/libs/*.jar'
